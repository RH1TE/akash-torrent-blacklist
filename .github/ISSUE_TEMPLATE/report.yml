name: Submit a tenant abuse report
description: Report observed P2P activity for maintainer review
title: "[Report] "
labels: ["needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Reports are public and do not automatically blacklist a wallet. Do not post private client IPs, personal identities, full access logs, private network maps, media content or unredacted copyright complaints. See REVIEW.md before submitting.
  - type: input
    id: wallet
    attributes:
      label: Akash tenant wallet
      description: On-chain tenant account, not a provider or treasury wallet.
      placeholder: akash1...
    validations:
      required: true
  - type: input
    id: dseq
    attributes:
      label: Deployment sequence number
      placeholder: DSEQ from the on-chain lease
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Incident time or observation window in UTC
      placeholder: 2026-01-15T12:00:00Z
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Provider region
      placeholder: eu-central
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Proposed finding
      options:
        - Investigation lead only
        - P2P workload prohibited by the provider AUP
        - Reported infringement with session-level technical attribution
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: What actually ran?
      description: Container, command, pod runtime or service evidence. Distinguish configuration from execution.
    validations:
      required: true
  - type: textarea
    id: records
    attributes:
      label: Independent evidence records
      description: Describe original source, timestamp and the fact it establishes. Do not attach private raw logs.
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Network attribution
      description: Was a historical NAT source-port or flow mapping preserved? If not, say so.
    validations:
      required: true
  - type: textarea
    id: policy
    attributes:
      label: Relevant provider acceptable use policy
      description: Public link or relevant wording and date. State if no explicit policy applied.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: What is not established?
      description: False-positive possibilities, shared IP issues, missing packets or clock uncertainty.
    validations:
      required: true
  - type: checkboxes
    id: declaration
    attributes:
      label: Confirmation
      options:
        - label: I can verify the report evidence and have excluded personal data, private logs and confidential material.
          required: true
        - label: I understand that opening this issue does not add a wallet to the blacklist.
          required: true
